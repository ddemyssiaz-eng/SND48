<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - ร้านค้า (Shop)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .phone-frame { max-width: 430px; height: 880px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Phone Container -->
    <div class="phone-frame bg-gray-50 w-full h-screen sm:h-[850px] sm:rounded-[40px] flex flex-col justify-between relative overflow-hidden border border-purple-100 shadow-2xl">
        
        <!-- Header -->
        <div class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 pt-8">
            <div class="flex items-center space-x-3">
                <a href="home.html" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-purple-50 hover:text-purple-600 transition-all">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </a>
                <h1 class="text-base font-bold text-gray-800">ร้านค้า (Shop)</h1>
            </div>
            <!-- แสดงยอดเงินและพ้อยต์ปัจจุบัน -->
            <div class="flex items-center space-x-2 text-[10px] font-bold">
                <span class="bg-amber-50 text-amber-600 px-2.5 py-1 rounded-full border border-amber-200" id="user-coin">🪙 0 C</span>
                <span class="bg-purple-50 text-purple-600 px-2.5 py-1 rounded-full border border-purple-200" id="user-point">💎 0 P</span>
            </div>
        </div>

        <!-- Content Area: รายการสินค้า -->
        <div class="flex-1 overflow-y-auto p-4 grid grid-cols-2 gap-3" id="shop-items-grid">
            <div class="col-span-2 text-center text-gray-400 text-xs py-10">กำลังโหลดสินค้า...</div>
        </div>

        <!-- Footer Bar -->
        <div class="py-3 flex justify-center bg-white border-t border-gray-100">
            <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        let currentUser = requireAuth();

        window.addEventListener('DOMContentLoaded', async () => {
            await refreshUserData();
            loadShopItems();
        });

        async function refreshUserData() {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('coin, point')
                    .eq('email', currentUser.email)
                    .single();

                if (data) {
                    currentUser.coin = data.coin;
                    currentUser.point = data.point;
                    localStorage.setItem('snd48_user', JSON.stringify(currentUser));
                    
                    document.getElementById('user-coin').textContent = `🪙 ${data.coin} C`;
                    document.getElementById('user-point').textContent = `💎 ${data.point} P`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function loadShopItems() {
            try {
                const { data, error } = await supabase
                    .from('shop_items')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const grid = document.getElementById('shop-items-grid');
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="col-span-2 text-center text-gray-400 text-xs py-10">ยังไม่มีสินค้าในร้านค้า</div>';
                    return;
                }

                grid.innerHTML = data.map(item => `
                    <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm flex flex-col justify-between">
                        <div>
                            <img src="${item.image_url}" alt="${item.name}" class="w-full h-32 object-cover rounded-xl mb-2 bg-gray-100">
                            <h3 class="font-bold text-gray-800 text-xs line-clamp-1">${item.name}</h3>
                            <p class="text-[10px] text-gray-400 line-clamp-2 mt-0.5">${item.description || 'ไม่มีรายละเอียด'}</p>
                        </div>
                        <div class="mt-3 pt-2 border-t border-gray-50 flex items-center justify-between">
                            <span class="text-xs font-extrabold ${item.currency_type === 'coin' ? 'text-amber-500' : 'text-purple-600'}">
                                ${item.price} ${item.currency_type === 'coin' ? 'C' : 'P'}
                            </span>
                            <button onclick="buyItem('${item.id}', '${item.name}', ${item.price}, '${item.currency_type}', '${item.image_url}', '${item.description || ''}')" 
                                class="bg-purple-600 hover:bg-purple-700 text-white text-[10px] font-semibold px-3 py-1.5 rounded-xl transition-all shadow-md shadow-purple-100">
                                ซื้อสินค้า
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function buyItem(id, name, price, currencyType, imageUrl, description) {
            await refreshUserData();

            let currentCoin = currentUser.coin;
            let currentPoint = currentUser.point;

            if (currencyType === 'coin' && currentCoin < price) {
                alert('Coin ของคุณไม่เพียงพอสำหรับการซื้อสินค้านี้!');
                return;
            }
            if (currencyType === 'point' && currentPoint < price) {
                alert('Point ของคุณไม่เพียงพอสำหรับการซื้อสินค้านี้!');
                return;
            }

            if (!confirm(`คุณต้องการซื้อ "${name}" ในราคา ${price} ${currencyType === 'coin' ? 'Coin' : 'Point'} ใช่หรือไม่?`)) {
                return;
            }

            try {
                // 1. หักเงินหรือพ้อยต์จากตาราง users
                let updatedCoin = currentCoin;
                let updatedPoint = currentPoint;
                if (currencyType === 'coin') updatedCoin -= price;
                else updatedPoint -= price;

                const { error: updateError } = await supabase
                    .from('users')
                    .update({ coin: updatedCoin, point: updatedPoint })
                    .eq('email', currentUser.email);

                if (updateError) throw updateError;

                // 2. เพิ่มสินค้าลงในตาราง inventory ของผู้ใช้
                const { error: inventoryError } = await supabase
                    .from('inventory')
                    .insert([{
                        user_email: currentUser.email,
                        item_name: name,
                        image_url: imageUrl,
                        description: description
                    }]);

                if (inventoryError) throw inventoryError;

                // อัปเดต state ในเครื่อง
                currentUser.coin = updatedCoin;
                currentUser.point = updatedPoint;
                localStorage.setItem('snd48_user', JSON.stringify(currentUser));

                alert(`ซื้อสินค้า "${name}" สำเร็จ! สินค้าถูกเพิ่มเข้าไปใน Inventory ของคุณแล้ว`);
                refreshUserData();
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการซื้อสินค้า: ' + err.message);
            }
        }
    </script>
</body>
</html>
