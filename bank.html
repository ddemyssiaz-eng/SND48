<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - ธนาคาร (Bank)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background: #f4f6f9; color: #0b2545; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .phone-frame { width: 380px; height: 750px; background: #ffffff; border-radius: 40px; border: 8px solid #0b2545; box-shadow: 0 20px 40px rgba(11, 37, 69, 0.15); display: flex; flex-direction: column; padding: 20px; position: relative; overflow-y: auto; }
        
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { background: #f0f4f8; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 1rem; color: #0b2545; display: flex; align-items: center; justify-content: center; }
        .header h2 { font-size: 1.1rem; margin: 0 auto; color: #0b2545; }

        /* บัตรเครดิตแสดงยอดเงิน & เลขบัญชี */
        .bank-card { background: linear-gradient(135deg, #0b2545, #134074); color: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(11, 37, 69, 0.2); }
        .bank-title { font-size: 0.75rem; opacity: 0.8; letter-spacing: 1px; margin-bottom: 4px; }
        .account-number { font-size: 1.1rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 15px; }
        .balance-row { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; }
        .balance-item span { font-size: 0.7rem; opacity: 0.8; display: block; }
        .balance-item b { font-size: 1.2rem; }

        /* ส่วนฟังก์ชันการโอน */
        .section-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 15px; margin-bottom: 15px; }
        .section-box h3 { font-size: 0.9rem; margin-top: 0; margin-bottom: 10px; color: #0b2545; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: #6b7c93; margin-bottom: 3px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.85rem; outline: none; background: #ffffff; }
        
        .action-btn { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #0b2545; color: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .action-btn:hover { background: #133863; }

        /* รายชื่อผู้รับเงินที่บันทึกไว้ */
        .saved-list { max-height: 120px; overflow-y: auto; margin-top: 5px; }
        .saved-item { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 6px 10px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 5px; font-size: 0.75rem; cursor: pointer; }
        .saved-item:hover { background: #f1f5f9; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="header">
            <button class="back-btn" onclick="location.href='home.html'">❮</button>
            <h2>SND48 Bank</h2>
            <div style="width: 35px;"></div>
        </div>

        <!-- บัตรบัญชีธนาคาร -->
        <div class="bank-card">
            <div class="bank-title">SND48 SAVINGS ACCOUNT</div>
            <div class="account-number" id="acc-number">----------</div>
            <div class="balance-row">
                <div class="balance-item">
                    <span>COIN (เงิน)</span>
                    <b id="user-coin">0</b> C
                </div>
                <div class="balance-item" style="text-align: right;">
                    <span>POINT (พ้อยต์)</span>
                    <b id="user-point">0</b> P
                </div>
            </div>
        </div>

        <!-- ฟังก์ชันโอนเงิน/พ้อยต์ -->
        <div class="section-box">
            <h3>💸 โอนเงิน หรือ โอนพ้อยต์</h3>
            <div class="form-group">
                <label>เลขบัญชีผู้รับ (10 หลัก)</label>
                <input type="text" id="transfer-acc" maxlength="10" placeholder="กรอกเลขบัญชี 10 หลัก">
            </div>
            <div class="form-group">
                <label>ประเภทที่ต้องการโอน</label>
                <select id="transfer-type">
                    <option value="coin">Coin (เงิน)</option>
                    <option value="point">Point (พ้อยต์)</option>
                </select>
            </div>
            <div class="form-group">
                <label>จำนวน</label>
                <input type="number" id="transfer-amount" placeholder="ระบุจำนวน">
            </div>
            <button class="action-btn" onclick="transferAsset()">ยืนยันการโอน</button>
        </div>

        <!-- รายชื่อผู้รับเงินที่บันทึกไว้ / เซฟชื่อ -->
        <div class="section-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h3 style="margin: 0;">📒 รายชื่อผู้รับเงินที่บันทึก</h3>
                <button style="font-size: 0.7rem; padding: 3px 8px; background: #e2e8f0; border: none; border-radius: 5px; cursor: pointer;" onclick="saveBeneficiaryPrompt()">+ บันทึกบัญชี</button>
            </div>
            <div class="saved-list" id="beneficiaries-container">
                <!-- รายชื่อจะถูกโหลดมาตรงนี้ -->
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        const currentUser = requireAuth();
        let myData = null;

        async function loadBankData() {
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('email', currentUser.email)
                .single();

            if (data) {
                myData = data;
                document.getElementById('acc-number').innerText = data.account_number;
                document.getElementById('user-coin').innerText = data.coin.toLocaleString();
                document.getElementById('user-point').innerText = data.point.toLocaleString();
            }
        }

        // โหลดรายชื่อผู้รับเงินจาก LocalStorage (เพื่อให้ง่ายและรวดเร็วต่อการทดสอบฝั่งผู้ใช้)
        function loadBeneficiaries() {
            const container = document.getElementById('beneficiaries-container');
            container.innerHTML = '';
            const saved = JSON.parse(localStorage.getItem(`snd48_beneficiaries_${currentUser.email}`)) || [];
            
            if (saved.length === 0) {
                container.innerHTML = '<div style="color: #94a3b8; text-align: center; font-size: 0.75rem;">ยังไม่มีรายชื่อที่บันทึกไว้</div>';
                return;
            }

            saved.forEach((b, index) => {
                container.innerHTML += `
                    <div class="saved-item" onclick="selectBeneficiary('${b.acc}')">
                        <div><b>${b.name}</b><br><span style="color: #64748b;">${b.acc}</span></div>
                        <button style="background: #fee2e2; color: #ef4444; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer;" onclick="event.stopPropagation(); removeBeneficiary(${index})">ลบ</button>
                    </div>
                `;
            });
        }

        function saveBeneficiaryPrompt() {
            const name = prompt('กรอกชื่อเล่น / ชื่อผู้เล่นที่ต้องการบันทึก:');
            const acc = prompt('กรอกเลขบัญชี 10 หลัก:');
            if (name && acc && acc.length === 10) {
                const saved = JSON.parse(localStorage.getItem(`snd48_beneficiaries_${currentUser.email}`)) || [];
                saved.push({ name, acc });
                localStorage.setItem(`snd48_beneficiaries_${currentUser.email}`, JSON.stringify(saved));
                loadBeneficiaries();
                alert('บันทึกรายชื่อผู้รับเงินสำเร็จ!');
            } else {
                alert('ข้อมูลไม่ถูกต้อง หรือเลขบัญชีต้องมี 10 หลัก');
            }
        }

        function selectBeneficiary(acc) {
            document.getElementById('transfer-acc').value = acc;
        }

        function removeBeneficiary(index) {
            const saved = JSON.parse(localStorage.getItem(`snd48_beneficiaries_${currentUser.email}`)) || [];
            saved.splice(index, 1);
            localStorage.setItem(`snd48_beneficiaries_${currentUser.email}`, JSON.stringify(saved));
            loadBeneficiaries();
        }

        async function transferAsset() {
            const receiverAcc = document.getElementById('transfer-acc').value.trim();
            const type = document.getElementById('transfer-type').value;
            const amount = parseInt(document.getElementById('transfer-amount').value);

            if (!receiverAcc || receiverAcc.length !== 10) {
                alert('กรุณากรอกเลขบัญชีผู้รับให้ถูกต้อง (10 หลัก)');
                return;
            }
            if (!amount || amount <= 0) {
                alert('กรุณากรอกจำนวนเงินหรือพ้อยต์ที่ต้องการโอน');
                return;
            }
            if (receiverAcc === myData.account_number) {
                alert('ไม่สามารถโอนให้บัญชีตัวเองได้');
                return;
            }

            // ตรวจสอบยอดเงินตัวเอง
            if (type === 'coin' && myData.coin < amount) {
                alert('Coin ของคุณไม่เพียงพอสำหรับการโอน');
                return;
            }
            if (type === 'point' && myData.point < amount) {
                alert('Point ของคุณไม่เพียงพอสำหรับการโอน');
                return;
            }

            // ค้นหาบัญชีผู้รับในฐานข้อมูล Supabase
            const { data: receiverData, error: receiverErr } = await supabase
                .from('users')
                .select('*')
                .eq('account_number', receiverAcc)
                .single();

            if (receiverErr || !receiverData) {
                alert('ไม่พบเลขบัญชีผู้รับนี้ในระบบ SND48');
                return;
            }

            // หักเงินผู้โอน
            const newSenderCoin = type === 'coin' ? myData.coin - amount : myData.coin;
            const newSenderPoint = type === 'point' ? myData.point - amount : myData.point;

            await supabase.from('users').update({ coin: newSenderCoin, point: newSenderPoint }).eq('email', currentUser.email);

            // เพิ่มเงินผู้รับ
            const newReceiverCoin = type === 'coin' ? receiverData.coin + amount : receiverData.coin;
            const newReceiverPoint = type === 'point' ? receiverData.point + amount : receiverData.point;

            await supabase.from('users').update({ coin: newReceiverCoin, point: newReceiverPoint }).eq('account_number', receiverAcc);

            alert(`โอนสำเร็จ! ส่งไปยังบัญชี ${receiverAcc} จำนวน ${amount} ${type.toUpperCase()}`);
            document.getElementById('transfer-acc').value = '';
            document.getElementById('transfer-amount').value = '';
            loadBankData();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadBankData();
            loadBeneficiaries();
        });
    </script>
</body>
</html>
