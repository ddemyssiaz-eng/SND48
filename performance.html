<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - ผลงานเพลง</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .phone-frame { max-width: 430px; height: 880px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Phone Container -->
    <div class="phone-frame bg-gray-50 w-full h-screen sm:h-[850px] sm:rounded-[40px] flex flex-col justify-between relative overflow-hidden border border-purple-100 shadow-2xl">
        
        <!-- Header -->
        <div class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 pt-8">
            <div class="flex items-center space-x-3">
                <a href="home.html" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-purple-50 hover:text-purple-600 transition-all">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </a>
                <h1 class="text-base font-bold text-gray-800">ผลงานเพลง (Performances)</h1>
            </div>
            <div class="w-9"></div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4" id="performances-list">
            <div class="text-center text-gray-400 text-xs py-10">กำลังโหลดผลงานเพลง...</div>
        </div>

        <!-- Footer Bar -->
        <div class="py-3 flex justify-center bg-white border-t border-gray-100">
            <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        requireAuth();

        window.addEventListener('DOMContentLoaded', () => {
            loadPerformances();
        });

        async function loadPerformances() {
            try {
                const { data, error } = await supabase
                    .from('performances')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const container = document.getElementById('performances-list');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-400 text-xs py-10">ยังไม่มีผลงานเพลงในระบบ</div>';
                    return;
                }

                container.innerHTML = data.map(p => `
                    <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center font-bold text-sm">
                                    <i class="fa-solid fa-music"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-800 text-sm">${p.song_title}</h3>
                                    <span class="text-[10px] text-purple-600 font-semibold bg-purple-50 px-2 py-0.5 rounded-full">
                                        Center: ${p.center_member}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="border-t border-gray-50 pt-2">
                            <span class="text-[10px] text-gray-400 block mb-1">รายชื่อสมาชิกในเพลง:</span>
                            <div class="flex flex-wrap gap-1">
                                ${p.members.map(m => `
                                    <span class="text-[10px] bg-gray-100 text-gray-700 px-2 py-0.5 rounded-lg font-medium">${m}</span>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
