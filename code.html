<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - กรอกโค้ดรับรางวัล</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background: #f4f6f9; color: #0b2545; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .phone-frame { width: 380px; height: 750px; background: #ffffff; border-radius: 40px; border: 8px solid #0b2545; box-shadow: 0 20px 40px rgba(11, 37, 69, 0.15); display: flex; flex-direction: column; padding: 20px; position: relative; overflow-y: auto; }
        .header { display: flex; align-items: center; margin-bottom: 25px; }
        .back-btn { background: #f0f4f8; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 1rem; color: #0b2545; display: flex; align-items: center; justify-content: center; }
        .header h2 { font-size: 1.2rem; margin: 0 auto; color: #0b2545; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; text-align: center; }
        .input-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 1rem; text-align: center; margin-bottom: 12px; outline: none; }
        .action-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #0b2545; color: white; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .action-btn:hover { background: #133863; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="header">
            <button class="back-btn" onclick="location.href='home.html'">❮</button>
            <h2>แลกรับโค้ดรางวัล</h2>
            <div style="width: 35px;"></div>
        </div>

        <div class="card">
            <p style="font-size: 0.85rem; color: #6b7c93; margin-top: 0;">กรอกโค้ดลับเพื่อรับ Coin หรือ Point เข้าบัญชีธนาคารของคุณทันที!</p>
            <input type="text" id="code-input" class="input-box" placeholder="กรอกโค้ดที่นี่">
            <button class="action-btn" onclick="redeemCode()">ยืนยันการแลกโค้ด</button>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        const currentUser = requireAuth();

        async function redeemCode() {
            const codeStr = document.getElementById('code-input').value.trim().toUpperCase();
            if (!codeStr) {
                alert('กรุณากรอกโค้ด');
                return;
            }

            // 1. ตรวจสอบว่าโค้ดมีอยู่จริงไหม
            const { data: codeData, error: codeErr } = await supabase
                .from('codes')
                .select('*')
                .eq('code_string', codeStr)
                .single();

            if (codeErr || !codeData) {
                alert('ไม่พบโค้ดนี้ หรือโค้ดไม่ถูกต้อง');
                return;
            }

            // 2. ตรวจสอบวันหมดอายุ
            if (codeData.expire_date && new Date() > new Date(codeData.expire_date)) {
                alert('โค้ดนี้หมดอายุแล้ว');
                return;
            }

            // 3. ตรวจสอบว่าผู้ใช้เคยใช้โค้ดนี้ไปแล้วหรือยัง
            const { data: usedData } = await supabase
                .from('user_codes')
                .select('*')
                .eq('email', currentUser.email)
                .eq('code_id', codeData.id)
                .single();

            if (usedData) {
                alert('คุณได้ใช้โค้ดนี้ไปแล้ว ไม่สามารถใช้ซ้ำได้');
                return;
            }

            // 4. บันทึกประวัติการใช้โค้ด
            await supabase.from('user_codes').insert([{
                email: currentUser.email,
                code_id: codeData.id
            }]);

            // 5. ดึงยอดเงิน/พ้อยต์ปัจจุบันมาบวกเพิ่ม
            const { data: userData } = await supabase
                .from('users')
                .select('coin, point')
                .eq('email', currentUser.email)
                .single();

            let addCoin = 0;
            let addPoint = 0;

            codeData.rewards.forEach(r => {
                if (r.type === 'coin') addCoin += r.amount;
                if (r.type === 'point') addPoint += r.amount;
            });

            const newCoin = (userData.coin || 0) + addCoin;
            const newPoint = (userData.point || 0) + addPoint;

            await supabase
                .from('users')
                .update({ coin: newCoin, point: newPoint })
                .eq('email', currentUser.email);

            alert(`แลกโค้ดสำเร็จ! ได้รับ ${addCoin > 0 ? addCoin + ' Coin ' : ''}${addPoint > 0 ? addPoint + ' Point' : ''}`);
            document.getElementById('code-input').value = '';
        }
    </script>
</body>
</html>
