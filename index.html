<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - เข้าสู่ระบบ / สมัครสมาชิก</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { 
            background: #f4f6f9; /* สีขาวมุก / เทาอ่อนพรีเมียม */
            color: #0b2545; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        .auth-container { 
            width: 100%; 
            max-width: 400px; 
            background: #ffffff; 
            border-radius: 24px; 
            padding: 35px; 
            box-shadow: 0 10px 30px rgba(11, 37, 69, 0.08); 
            border: 1px solid rgba(11, 37, 69, 0.1);
        }

        .logo-area { text-align: center; margin-bottom: 25px; }
        .logo-area h1 { font-size: 2.2rem; font-weight: 600; color: #0b2545; margin: 0; letter-spacing: 2px; }
        .logo-area p { font-size: 0.85rem; color: #6b7c93; margin-top: 5px; }

        /* Tabs สำหรับสลับ Login / Register */
        .tabs { display: flex; margin-bottom: 25px; background: #eef2f7; border-radius: 12px; padding: 4px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; font-size: 0.9rem; font-weight: 600; color: #6b7c93; cursor: pointer; border-radius: 10px; transition: 0.2s; }
        .tab-btn.active { background: #0b2545; color: #ffffff; box-shadow: 0 4px 12px rgba(11,37,69,0.2); }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #0b2545; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 0.95rem; outline: none; transition: 0.2s; background: #fafbfc; }
        .form-group input:focus { border-color: #0b2545; background: #fff; box-shadow: 0 0 0 3px rgba(11,37,69,0.1); }

        .submit-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; background: #0b2545; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .submit-btn:hover { background: #133863; transform: translateY(-1px); }

        .error-msg { color: #e53e3e; font-size: 0.8rem; text-align: center; margin-top: 12px; min-height: 18px; }
        
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-area">
            <h1>SND48</h1>
            <p>Official Fan & Member Portal</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">เข้าสู่ระบบ</button>
            <button class="tab-btn" onclick="switchTab('register')">สมัครสมาชิก</button>
        </div>

        <!-- ฟอร์มเข้าสู่ระบบ -->
        <div id="login-section" class="form-section active">
            <div class="form-group">
                <label>อีเมล (Email)</label>
                <input type="email" id="login-email" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>รหัสผ่าน (Password)</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button class="submit-btn" onclick="handleLogin()">เข้าสู่ระบบ</button>
        </div>

        <!-- ฟอร์มสมัครสมาชิก -->
        <div id="register-section" class="form-section">
            <div class="form-group">
                <label>อีเมล (Email)</label>
                <input type="email" id="reg-email" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>รหัสผ่าน (Password)</label>
                <input type="password" id="reg-password" placeholder="••••••••">
            </div>
            <button class="submit-btn" onclick="handleRegister()">สมัครสมาชิก</button>
        </div>

        <div id="message" class="error-msg"></div>
    </div>

    <!-- โหลดไฟล์เชื่อมต่อกลาง -->
    <script src="supabase-config.js"></script>
    <script>
        // ตรวจสอบว่าเคยเข้าสู่ระบบไว้แล้วหรือไม่ ถ้ามีให้เด้งไป home.html ทันที
        window.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (user) {
                window.location.href = 'home.html';
            }
        });

        // สลับแท็บฟอร์ม
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('message').innerText = '';

            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('login-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('register-section').classList.add('active');
            }
        }

        // ฟังก์ชันสุ่มเลขบัญชี 10 หลัก
        function generateAccountNumber() {
            let acc = '';
            for (let i = 0; i < 10; i++) {
                acc += Math.floor(Math.random() * 10);
            }
            return acc;
        }

        // ระบบสมัครสมาชิก
        async function handleRegister() {
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const msg = document.getElementById('message');

            if (!email || !password) {
                msg.innerText = 'กรุณากรอกข้อมูลให้ครบถ้วน';
                return;
            }

            const accountNumber = generateAccountNumber();

            const { data, error } = await supabase
                .from('users')
                .insert([{ 
                    email: email, 
                    password: password, 
                    account_number: accountNumber,
                    role: 'user',
                    coin: 100,
                    point: 50
                }])
                .select();

            if (error) {
                msg.innerText = 'อีเมลนี้ถูกใช้งานแล้ว หรือเกิดข้อผิดพลาด';
                console.error(error);
            } else {
                alert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
                switchTab('login');
                document.getElementById('login-email').value = email;
            }
        }

        // ระบบเข้าสู่ระบบ
        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const msg = document.getElementById('message');

            if (!email || !password) {
                msg.innerText = 'กรุณากรอกอีเมลและรหัสผ่าน';
                return;
            }

            // เช็คเคสแอดมินพิเศษตามเงื่อนไข
            if (email === 'lns48official@gmail.com' && password === 'Ins48.official') {
                const adminUser = {
                    email: email,
                    role: 'admin',
                    account_number: 'ADMIN-0000',
                    coin: 999999,
                    point: 999999
                };
                localStorage.setItem('snd48_user', JSON.stringify(adminUser));
                window.location.href = 'home.html';
                return;
            }

            // ค้นหาข้อมูลจากตาราง users ใน Supabase
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('email', email)
                .eq('password', password)
                .single();

            if (error || !data) {
                msg.innerText = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
            } else {
                // บันทึกลง localStorage เพื่อจำสถานะการล็อกอิน
                localStorage.setItem('snd48_user', JSON.stringify(data));
                window.location.href = 'home.html';
            }
        }
    </script>
</body>
</html>
