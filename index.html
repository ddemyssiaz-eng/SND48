<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - SND48</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-blue-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-blue-100">
        <!-- Header Section -->
        <div class="bg-blue-600 p-8 text-center text-white relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-blue-500 rounded-full opacity-50 pointer-events-none"></div>
            <h1 class="text-3xl font-bold tracking-wider mb-1">SND48</h1>
            <p class="text-blue-100 text-sm">ยินดีต้อนรับเข้าสู่ระบบแฟนคลับและชุมชนวง SND48</p>
        </div>

        <!-- Form Container -->
        <div class="p-8">
            <!-- Tabs Switcher -->
            <div class="flex bg-blue-50 p-1 rounded-xl mb-6">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-white text-blue-600 shadow-sm">เข้าสู่ระบบ</button>
                <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-gray-500 hover:text-blue-600">สมัครสมาชิก</button>
            </div>

            <!-- Error / Success Alert Box -->
            <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-sm font-medium"></div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm" placeholder="example@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm" placeholder="••••••••">
                </div>
                <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-blue-200 text-sm">
                    เข้าสู่ระบบ
                </button>
            </form>

            <!-- Register Form -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm" placeholder="example@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                    <input type="password" id="reg-password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all text-sm" placeholder="••••••••">
                </div>
                <button type="submit" id="btn-register" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-blue-200 text-sm">
                    สมัครสมาชิก
                </button>
            </form>
        </div>
    </div>

    <!-- Script ควบคุมการทำงาน -->
    <script src="supabase-config.js"></script>
    <script>
        // เช็คว่าเคยล็อกอินค้างไว้หรือไม่ ถ้ามีให้เด้งไปหน้า home.html ทันที
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('snd48_user');
            if (savedUser) {
                window.location.href = 'home.html';
            }
        });

        // สลับแท็บระหว่าง เข้าสู่ระบบ และ สมัครสมาชิก
        function switchTab(type) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            hideAlert();

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-white text-blue-600 shadow-sm";
                tabRegister.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-gray-500 hover:text-blue-600";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-white text-blue-600 shadow-sm";
                tabLogin.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-gray-500 hover:text-blue-600";
            }
        }

        // แสดงข้อความแจ้งเตือน
        function showAlert(message, isError = true) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = message;
            alertBox.className = `mb-4 p-3 rounded-xl text-sm font-medium ${isError ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-600 border border-green-100'}`;
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        // สุ่มเลขบัญชี 10 หลัก
        function generateAccountNumber() {
            let acc = '';
            for (let i = 0; i < 10; i++) {
                acc += Math.floor(Math.random() * 10);
            }
            return acc;
        }

        // ฟังก์ชันจัดการสมัครสมาชิก
        async function handleRegister(e) {
            e.preventDefault();
            hideAlert();
            
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const btn = document.getElementById('btn-register');

            btn.disabled = true;
            btn.textContent = 'กำลังสมัครสมาชิก...';

            try {
                // เช็คว่าอีเมลซ้ำในระบบหรือยัง
                const { data: existingUser, error: checkError } = await supabase
                    .from('users')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (existingUser) {
                    showAlert('อีเมลนี้ถูกใช้งาน รบกวนใช้อีเมลอื่นหรือเข้าสู่ระบบ');
                    btn.disabled = false;
                    btn.textContent = 'สมัครสมาชิก';
                    return;
                }

                // กำหนด Role และบัญชีแอดมินพิเศษตามเงื่อนไขใหม่
                let role = 'user';
                if (email === 'snd48official@gmail.com') {
                    role = 'admin';
                }

                const account_number = generateAccountNumber();

                // บันทึกข้อมูลลงตาราง users ของ Supabase โดยตรง
                const { data, error } = await supabase
                    .from('users')
                    .insert([{
                        email: email,
                        password: password,
                        account_number: account_number,
                        role: role,
                        coin: 100,
                        point: 50
                    }])
                    .select()
                    .single();

                if (error) throw error;

                showAlert('สมัครสมาชิกสำเร็จ! กำลังพาท่านเข้าสู่ระบบ...', false);
                
                // บันทึกลง LocalStorage และพาไปหน้า home.html
                localStorage.setItem('snd48_user', JSON.stringify(data));
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1000);

            } catch (err) {
                console.error(err);
                showAlert('เกิดข้อผิดพลาดในการสมัครสมาชิก: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'สมัครสมาชิก';
            }
        }

        // ฟังก์ชันจัดการเข้าสู่ระบบ
        async function handleLogin(e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const btn = document.getElementById('btn-login');

            btn.disabled = true;
            btn.textContent = 'กำลังตรวจสอบ...';

            try {
                // ตรวจสอบเงื่อนไขบัญชีแอดมินพิเศษ
                if (email === 'snd48official@gmail.com' && password !== 'snd48.official') {
                    showAlert('รหัสผ่านแอดมินไม่ถูกต้อง');
                    btn.disabled = false;
                    btn.textContent = 'เข้าสู่ระบบ';
                    return;
                }

                // ค้นหาข้อมูลผู้ใช้ในตาราง users
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (error || !data) {
                    showAlert('ไม่พบอีเมลนี้ในระบบ กรุณาตรวจสอบอีกครั้งหรือสมัครสมาชิก');
                    btn.disabled = false;
                    btn.textContent = 'เข้าสู่ระบบ';
                    return;
                }

                // ตรวจสอบรหัสผ่าน
                if (data.password !== password) {
                    showAlert('รหัสผ่านไม่ถูกต้อง');
                    btn.disabled = false;
                    btn.textContent = 'เข้าสู่ระบบ';
                    return;
                }

                showAlert('เข้าสู่ระบบสำเร็จ!', false);

                // บันทึกลง LocalStorage และไปหน้า home.html
                localStorage.setItem('snd48_user', JSON.stringify(data));
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 800);

            } catch (err) {
                console.error(err);
                showAlert('เกิดข้อผิดพลาดในการเข้าสู่ระบบ: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'เข้าสู่ระบบ';
            }
        }
    </script>
</body>
</html>
