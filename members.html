<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - Members สมาชิกวง</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .phone-frame { max-width: 430px; height: 880px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Phone Container -->
    <div class="phone-frame bg-gray-50 w-full h-screen sm:h-[850px] sm:rounded-[40px] flex flex-col justify-between relative overflow-hidden border border-purple-100 shadow-2xl">
        
        <!-- Header -->
        <div class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 pt-8">
            <div class="flex items-center space-x-3">
                <a href="home.html" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-purple-50 hover:text-purple-600 transition-all">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </a>
                <h1 class="text-base font-bold text-gray-800">SND48 Members</h1>
            </div>
            <!-- แสดงจำนวนโอชิและคามิโอชิ -->
            <div class="flex items-center space-x-1.5">
                <div id="user-oshi-count-badge" class="text-[10px] bg-pink-50 text-pink-600 border border-pink-200 px-2.5 py-1 rounded-full font-semibold">
                    โอชิ: 0 คน
                </div>
                <div id="user-kami-badge" class="text-[10px] bg-purple-100 text-purple-700 px-2.5 py-1 rounded-full font-semibold">
                    คามิ: -
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Search & Filter -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400 text-xs"></i>
                <input type="text" id="search-input" oninput="filterMembers()" placeholder="ค้นหาชื่อเล่น หรือรุ่น (Gen)..." class="w-full pl-10 pr-4 py-3 bg-white rounded-2xl border border-gray-200 text-xs focus:outline-none focus:border-purple-500 shadow-sm">
            </div>

            <!-- Members Grid -->
            <div id="members-grid" class="grid grid-cols-2 gap-3 pb-4">
                <div class="col-span-2 text-center py-10 text-gray-400 text-xs">กำลังโหลดข้อมูลสมาชิก...</div>
            </div>
        </div>

        <!-- Footer Bottom Bar -->
        <div class="py-3 flex justify-center bg-white border-t border-gray-100">
            <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
        </div>
    </div>

    <!-- Modal Detail Member -->
    <div id="member-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl animate-fade-in max-h-[85vh] flex flex-col">
            <div class="relative h-64 bg-gray-200">
                <img id="modal-img" src="" class="w-full h-full object-cover" alt="">
                <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 bg-black/40 text-white rounded-full flex items-center justify-center backdrop-blur-md">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4 flex-1">
                <div>
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 id="modal-nickname" class="text-lg font-bold text-gray-800"></h2>
                            <p id="modal-fullname" class="text-xs text-gray-500"></p>
                        </div>
                        <span id="modal-gen" class="px-2.5 py-1 bg-purple-100 text-purple-600 rounded-lg text-[10px] font-bold"></span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                        <span class="text-gray-400 block text-[10px]">วันเกิด</span>
                        <span id="modal-birth" class="font-semibold text-gray-700"></span>
                    </div>
                    <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                        <span class="text-gray-400 block text-[10px]">สถานะ</span>
                        <span id="modal-status" class="font-semibold text-gray-700"></span>
                    </div>
                </div>

                <!-- Oshi Action Buttons -->
                <div class="flex space-x-2">
                    <button onclick="setOshi()" class="flex-1 bg-pink-50 hover:bg-pink-100 text-pink-600 font-semibold py-2.5 rounded-xl text-xs transition-all border border-pink-200">
                        <i class="fa-solid fa-heart mr-1"></i> เพิ่มโอชิ
                    </button>
                    <button onclick="setKamiOshi()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-xl text-xs transition-all shadow-md shadow-purple-200">
                        <i class="fa-solid fa-star mr-1"></i> ตั้งเป็นคามิโอชิ
                    </button>
                </div>

                <!-- Performances List -->
                <div>
                    <h3 class="text-xs font-bold text-gray-700 mb-2">ผลงานเพลงที่เข้าร่วม</h3>
                    <div id="modal-performances" class="space-y-1.5 text-xs">
                        <span class="text-gray-400 text-[11px]">ไม่มีข้อมูลผลงานเพลง</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        let allMembers = [];
        let allPerformances = [];
        let selectedMember = null;
        const currentUser = requireAuth();

        window.addEventListener('DOMContentLoaded', () => {
            loadMembersData();
            loadUserOshiStatus();
        });

        async function loadMembersData() {
            try {
                const { data: members, error } = await supabase.from('members').select('*');
                if (error) throw error;
                allMembers = members || [];

                const { data: perfs } = await supabase.from('performances').select('*');
                allPerformances = perfs || [];

                renderMembers(allMembers);
            } catch (err) {
                console.error(err);
                document.getElementById('members-grid').innerHTML = '<div class="col-span-2 text-center text-red-500 text-xs">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
            }
        }

        async function loadUserOshiStatus() {
            try {
                // ดึงข้อมูลโอชิและคามิทั้งหมดของผู้ใช้คนนี้จาก Supabase
                const { data, error } = await supabase
                    .from('user_oshi')
                    .select('*')
                    .eq('user_email', currentUser.email);

                if (error) throw error;

                const oshiList = data ? data.filter(item => item.oshi_type === 'oshi') : [];
                const kamiItem = data ? data.find(item => item.oshi_type === 'kami') : null;

                // อัปเดตตัวเลขจำนวนโอชิ
                const oshiCountBadge = document.getElementById('user-oshi-count-badge');
                oshiCountBadge.textContent = `โอชิ: ${oshiList.length} คน`;

                // อัปเดตชื่อคามิโอชิ
                const kamiBadge = document.getElementById('user-kami-badge');
                if (kamiItem) {
                    kamiBadge.textContent = `คามิ: ${kamiItem.member_nickname}`;
                } else {
                    kamiBadge.textContent = `คามิ: -`;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('user-oshi-count-badge').textContent = `โอชิ: 0 คน`;
                document.getElementById('user-kami-badge').textContent = `คามิ: -`;
            }
        }

        function renderMembers(list) {
            const grid = document.getElementById('members-grid');
            if (list.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-gray-400 text-xs py-10">ยังไม่มีรายชื่อสมาชิกในวง</div>';
                return;
            }

            grid.innerHTML = list.map(m => `
                <div onclick='openMemberModal(${JSON.stringify(m)})' class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition-all cursor-pointer group">
                    <div class="h-44 overflow-hidden relative bg-gray-100">
                        <img src="${m.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition-all duration-300" alt="${m.nickname}">
                        <div class="absolute top-2 right-2 bg-black/40 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-full font-medium">
                            ${m.generation}
                        </div>
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-gray-800 text-xs">${m.nickname}</h3>
                        <p class="text-[10px] text-gray-400 truncate">${m.status}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterMembers() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const filtered = allMembers.filter(m => 
                m.nickname.toLowerCase().includes(keyword) || 
                m.generation.toLowerCase().includes(keyword) ||
                m.fullname.toLowerCase().includes(keyword)
            );
            renderMembers(filtered);
        }

        function openMemberModal(member) {
            selectedMember = member;
            document.getElementById('modal-img').src = member.image_url;
            document.getElementById('modal-nickname').textContent = member.nickname;
            document.getElementById('modal-fullname').textContent = member.fullname;
            document.getElementById('modal-gen').textContent = member.generation;
            document.getElementById('modal-birth').textContent = member.birthdate;
            document.getElementById('modal-status').textContent = member.status;

            const memberPerfs = allPerformances.filter(p => p.members && p.members.includes(member.nickname));
            const perfContainer = document.getElementById('modal-performances');
            
            if (memberPerfs.length > 0) {
                perfContainer.innerHTML = memberPerfs.map(p => `
                    <div class="bg-gray-50 p-2 rounded-xl flex justify-between items-center border border-gray-100">
                        <span class="font-medium text-gray-700">${p.song_title}</span>
                        <span class="text-[10px] text-purple-600 bg-purple-50 px-2 py-0.5 rounded-md">
                            ${p.center_member === member.nickname ? '⭐ เซ็นเตอร์' : 'สมาชิก'}
                        </span>
                    </div>
                `).join('');
            } else {
                perfContainer.innerHTML = '<span class="text-gray-400 text-[11px]">ยังไม่มีรายชื่อในผลงานเพลง</span>';
            }

            document.getElementById('member-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('member-modal').classList.add('hidden');
        }

        async function setOshi() {
            try {
                const { data: existing, error: checkError } = await supabase
                    .from('user_oshi')
                    .select('*')
                    .eq('user_email', currentUser.email)
                    .eq('member_nickname', selectedMember.nickname)
                    .eq('oshi_type', 'oshi');

                if (checkError) throw checkError;

                if (existing && existing.length > 0) {
                    alert(`${selectedMember.nickname} อยู่ในรายชื่อโอชิของคุณอยู่แล้ว`);
                    return;
                }

                const { error } = await supabase.from('user_oshi').insert([{
                    user_email: currentUser.email,
                    member_nickname: selectedMember.nickname,
                    oshi_type: 'oshi'
                }]);

                if (error) throw error;

                // โหลดสถานะและอัปเดตตัวเลขใหม่ทันที
                await loadUserOshiStatus();
                alert(`เพิ่ม ${selectedMember.nickname} เข้าสู่รายชื่อโอชิสำเร็จ!`);
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            }
        }

        async function setKamiOshi() {
            try {
                await supabase
                    .from('user_oshi')
                    .delete()
                    .eq('user_email', currentUser.email)
                    .eq('oshi_type', 'kami');

                const { error } = await supabase.from('user_oshi').insert([{
                    user_email: currentUser.email,
                    member_nickname: selectedMember.nickname,
                    oshi_type: 'kami'
                }]);

                if (error) throw error;

                await loadUserOshiStatus();
                alert(`ตั้ง ${selectedMember.nickname} เป็นคามิโอชิเรียบร้อย!`);
                closeModal();
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการบันทึกคามิโอชิ');
            }
        }
    </script>
</body>
</html>
