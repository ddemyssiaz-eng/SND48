<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - สมาชิกวง (Members)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background: #f4f6f9; color: #0b2545; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .phone-frame { width: 380px; height: 750px; background: #ffffff; border-radius: 40px; border: 8px solid #0b2545; box-shadow: 0 20px 40px rgba(11, 37, 69, 0.15); display: flex; flex-direction: column; padding: 20px; position: relative; overflow-y: auto; }
        
        .header { display: flex; align-items: center; margin-bottom: 15px; }
        .back-btn { background: #f0f4f8; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 1rem; color: #0b2545; display: flex; align-items: center; justify-content: center; }
        .header h2 { font-size: 1.1rem; margin: 0 auto; color: #0b2545; }

        .members-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 20px; }
        .member-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; cursor: pointer; text-align: center; transition: 0.2s; }
        .member-card:hover { transform: translateY(-3px); }
        .member-card img { width: 100%; height: 130px; object-fit: cover; }
        .member-card .info { padding: 8px; }
        .member-card .name { font-size: 0.85rem; font-weight: 600; color: #0b2545; }
        .member-card .gen { font-size: 0.7rem; color: #64748b; }

        /* Modal Popup รายละเอียดเมมเบอร์ */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10; padding: 20px; }
        .modal-content { background: #ffffff; width: 100%; border-radius: 20px; padding: 20px; text-align: center; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-content img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid #0b2545; }
        .close-modal { position: absolute; top: 12px; right: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer; }
        
        .oshi-btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; margin: 4px; }
        .kami-btn { background: #ec4899; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; margin: 4px; }
        .song-badge { background: #f1f5f9; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; display: inline-block; margin: 2px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="header">
            <button class="back-btn" onclick="location.href='home.html'">❮</button>
            <h2>SND48 Members</h2>
            <div style="width: 35px;">}</div>
        </div>

        <div class="members-grid" id="members-container">
            <!-- รายชื่อเมมเบอร์จะแสดงที่นี่ -->
        </div>

        <!-- Modal แสดงรายละเอียดรายบุคคล -->
        <div class="modal" id="member-modal">
            <div class="modal-content">
                <button class="close-modal" onclick="closeModal()">✕</button>
                <img id="modal-img" src="" alt="">
                <h3 id="modal-nickname" style="margin: 5px 0 2px 0;"></h3>
                <p id="modal-fullname" style="font-size: 0.8rem; color: #64748b; margin: 0 0 10px 0;"></p>
                <p id="modal-details" style="font-size: 0.75rem; color: #334155; margin-bottom: 10px;"></p>
                
                <div style="margin-bottom: 15px;">
                    <button class="oshi-btn" onclick="toggleOshi()">⭐ เพิ่มโอชิ</button>
                    <button class="kami-btn" onclick="setKami()">👑 ตั้งเป็นคามิโอชิ</button>
                </div>

                <div style="text-align: left; border-top: 1px solid #e2e8f0; padding-top: 10px;">
                    <b style="font-size: 0.8rem; color: #0b2545;">ผลงานเพลงที่ร่วมร้อง:</b>
                    <div id="modal-songs" style="margin-top: 5px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        const currentUser = requireAuth();
        let currentSelectedMember = null;
        let allPerformances = [];

        async function loadData() {
            // โหลดผลงานเพลงเตรียมไว้เช็ค
            const { data: perfData } = await supabase.from('performances').select('*');
            if (perfData) allPerformances = perfData;

            // โหลดรายชื่อสมาชิก
            const { data: members } = await supabase.from('members').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('members-container');
            container.innerHTML = '';

            if (members) {
                members.forEach(m => {
                    container.innerHTML += `
                        <div class="member-card" onclick='openModal(${JSON.stringify(m)})'>
                            <img src="${m.image_url}" alt="${m.nickname}">
                            <div class="info">
                                <div class="name">${m.nickname}</div>
                                <div class="gen">${m.generation}</div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function openModal(member) {
            currentSelectedMember = member;
            document.getElementById('modal-img').src = member.image_url;
            document.getElementById('modal-nickname').innerText = member.nickname;
            document.getElementById('modal-fullname').innerText = member.fullname;
            document.getElementById('modal-details').innerHTML = `
                <b>วันเกิด:</b> ${member.birthdate}<br>
                <b>รุ่น:</b> ${member.generation}<br>
                <b>สถานะ:</b> <span style="color: #0284c7; font-weight: 600;">${member.status}</span>
            `;

            // ค้นหาเพลงที่เมมเบอร์คนนี้ร่วมร้อง
            const songContainer = document.getElementById('modal-songs');
            songContainer.innerHTML = '';
            const matchedSongs = allPerformances.filter(p => p.members && p.members.includes(member.nickname));
            
            if (matchedSongs.length > 0) {
                matchedSongs.forEach(s => {
                    let centerText = s.center_member === member.nickname ? ' (Center 👑)' : '';
                    songContainer.innerHTML += `<span class="song-badge">${s.song_title}${centerText}</span>`;
                });
            } else {
                songContainer.innerHTML = '<span style="font-size: 0.75rem; color: #94a3b8;">ยังไม่มีผลงานเพลงในระบบ</span>';
            }

            document.getElementById('member-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('member-modal').style.display = 'none';
        }

        function toggleOshi() {
            alert(`เพิ่ม ${currentSelectedMember.nickname} เข้าสู่รายการโอชิของคุณแล้ว!`);
            closeModal();
        }

        function setKami() {
            alert(`ตั้ง ${currentSelectedMember.nickname} เป็นคามิโอชิ (Kami Oshi) ประจำตัวคุณแล้ว!`);
            closeModal();
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
