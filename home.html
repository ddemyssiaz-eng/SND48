<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - หน้าหลัก</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { 
            background: #f4f6f9; 
            color: #0b2545; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        .phone-frame { 
            width: 380px; 
            height: 750px; 
            background: #ffffff; 
            border-radius: 40px; 
            border: 8px solid #0b2545; 
            box-shadow: 0 20px 40px rgba(11, 37, 69, 0.15); 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            position: relative; 
            overflow-y: auto; 
        }

        /* ส่วนหัวโปรไฟล์และปุ่มออก */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .user-profile-btn { background: #f0f4f8; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; color: #0b2545; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .logout-btn { background: #fee2e2; color: #ef4444; border: none; padding: 6px 10px; border-radius: 12px; font-size: 0.75rem; cursor: pointer; font-weight: 600; }

        /* วิดเจ็ตป้ายบอกวันและสภาพอากาศจริง */
        .widget-card { 
            background: linear-gradient(135deg, #0b2545, #134074); 
            color: white; 
            border-radius: 20px; 
            padding: 18px; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 20px rgba(11, 37, 69, 0.2); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .widget-date { font-size: 0.85rem; opacity: 0.9; margin-bottom: 4px; }
        .widget-time { font-size: 1.6rem; font-weight: 600; letter-spacing: 1px; }
        .widget-weather { text-align: right; }
        .weather-temp { font-size: 1.4rem; font-weight: 600; }
        .weather-desc { font-size: 0.75rem; opacity: 0.85; }

        /* ตารางแอปพลิเคชัน (Grid App Icons) */
        .app-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            padding-bottom: 20px; 
        }
        .app-icon-box { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .app-icon-box:hover { transform: translateY(-3px); }
        .app-icon { 
            width: 65px; 
            height: 65px; 
            background: #f0f4f8; 
            border-radius: 18px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.6rem; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0; 
            margin-bottom: 6px; 
        }
        .app-name { font-size: 0.75rem; font-weight: 600; color: #0b2545; text-align: center; }

        /* ปุ่มเมนูแอดมินพิเศษเฉพาะ Admin */
        .admin-shortcut { 
            background: #dbeafe; 
            border: 1px dashed #3b82f6; 
            border-radius: 14px; 
            padding: 10px; 
            text-align: center; 
            margin-top: auto; 
            cursor: pointer; 
            font-size: 0.8rem; 
            font-weight: 600; 
            color: #1d4ed8; 
            display: none; 
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- แถบบน: ข้อมูลผู้ใช้ & ปุ่มออกจากระบบ -->
        <div class="top-bar">
            <button class="user-profile-btn" id="user-info-display">
                👤 กำลังโหลด...
            </button>
            <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
        </div>

        <!-- วิดเจ็ตวันที่ เวลา และสภาพอากาศจริง -->
        <div class="widget-card">
            <div>
                <div class="widget-date" id="current-date">--/--/----</div>
                <div class="widget-time" id="current-time">00:00:00</div>
            </div>
            <div class="widget-weather">
                <div class="weather-temp" id="weather-temp">--°C</div>
                <div class="weather-desc" id="weather-desc">กำลังโหลดอากาศ...</div>
            </div>
        </div>

        <!-- หน้าจอแอปพลิเคชัน (Grid) -->
        <div class="app-grid">
            <div class="app-icon-box" onclick="location.href='bank.html'">
                <div class="app-icon">🏦</div>
                <div class="app-name">Bank</div>
            </div>
            <div class="app-icon-box" onclick="location.href='members.html'">
                <div class="app-icon">💖</div>
                <div class="app-name">Members</div>
            </div>
            <div class="app-icon-box" onclick="location.href='code.html'">
                <div class="app-icon">🎁</div>
                <div class="app-name">Code</div>
            </div>
            <div class="app-icon-box" onclick="location.href='daily.html'">
                <div class="app-icon">📅</div>
                <div class="app-name">Daily</div>
            </div>
            <div class="app-icon-box" onclick="location.href='performance.html'">
                <div class="app-icon">🎤</div>
                <div class="app-name">Performance</div>
            </div>
            <div class="app-icon-box" onclick="location.href='shop.html'">
                <div class="app-icon">🛍️</div>
                <div class="app-name">Shop</div>
            </div>
            <div class="app-icon-box" onclick="location.href='inventory.html'">
                <div class="app-icon">🎒</div>
                <div class="app-name">Inventory</div>
            </div>
            <div class="app-icon-box" onclick="location.href='vote.html'">
                <div class="app-icon">🗳️</div>
                <div class="app-name">Vote</div>
            </div>
        </div>

        <!-- ปุ่มสำหรับ Admin เท่านั้น -->
        <div class="admin-shortcut" id="admin-panel-btn" onclick="location.href='admin/admin-members.html'">
            ⚙️ เข้าสู่ระบบหลังบ้าน (Admin Panel)
        </div>
    </div>

    <!-- โหลดไฟล์ตั้งค่ากลาง -->
    <script src="supabase-config.js"></script>
    <script>
        // ตรวจสอบสิทธิ์การเข้าใช้งาน
        const currentUser = requireAuth();

        // แสดงข้อมูลผู้ใช้ที่แถบบบน
        document.getElementById('user-info-display').innerHTML = `👤 ${currentUser.email} (${currentUser.role.toUpperCase()})`;

        // ถ้าเป็น Admin ให้แสดงปุ่มทางลัดหลังบ้าน
        if (currentUser.role === 'admin') {
            document.getElementById('admin-panel-btn').style.display = 'block';
        }

        // อัปเดต วัน เวลา แบบเรียลไทม์
        function updateClockAndDate() {
            const now = new Date();
            
            // วันที่ภาษาไทย
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date').innerText = now.toLocaleDateString('th-TH', options);
            
            // เวลา
            document.getElementById('current-time').innerText = now.toLocaleTimeString('th-TH');
        }
        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();

        // ดึงสภาพอากาศจริง (พิกัดกรุงเทพฯ / หรือตำแหน่งปัจจุบัน)
        async function fetchRealWeather() {
            try {
                // ใช้ Open-Meteo API ฟรีโดยไม่ต้องใช้ API Key สำหรับกรุงเทพฯ (Lat: 13.75, Lon: 100.52)
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=13.75&longitude=100.52&current_weather=true');
                const data = await res.json();
                if (data && data.current_weather) {
                    const temp = Math.round(data.current_weather.temperature);
                    const code = data.current_weather.weathercode;
                    
                    document.getElementById('weather-temp').innerText = `${temp}°C`;
                    document.getElementById('weather-desc').innerText = getWeatherDescription(code);
                }
            } catch (err) {
                document.getElementById('weather-desc').innerText = 'กรุงเทพมหานคร';
            }
        }

        // แปลง Weather Code เป็นคำอธิบายภาษาไทยสั้นๆ
        function getWeatherDescription(code) {
            if (code === 0) return 'ท้องฟ้าแจ่มใส';
            if (code >= 1 && code <= 3) return 'มีเมฆบางส่วน';
            if (code >= 51 && code <= 67) return 'ฝนตกปรอยๆ';
            if (code >= 95) return 'พายุฝนฟ้าคะนอง';
            return 'อากาศปกติ';
        }

        fetchRealWeather();
    </script>
</body>
</html>
