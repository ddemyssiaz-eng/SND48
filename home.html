<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - หน้าหลัก</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { 
            background: #f4f6f9; /* สีขาวมุกพรีเมียม */
            color: #0b2545; /* สีน้ำเงินเข้มตามโลโก้ */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        /* กรอบจำลองหน้าจอมือถือ */
        .phone-frame { 
            width: 380px; 
            height: 750px; 
            background: #ffffff; 
            border-radius: 40px; 
            border: 8px solid #0b2545; 
            box-shadow: 0 20px 40px rgba(11, 37, 69, 0.15); 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            position: relative; 
            overflow-y: auto; 
        }
        
        /* วิดเจ็ตบอก วัน เวลา สภาพอากาศ */
        .widget-box { 
            background: #f0f4f8; 
            padding: 15px 20px; 
            border-radius: 20px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid rgba(11, 37, 69, 0.08); 
        }
        .clock-time { font-size: 1.4rem; font-weight: 600; margin: 0; color: #0b2545; }
        .date-text { font-size: 0.75rem; color: #6b7c93; margin: 3px 0 0 0; }
        .weather-info { text-align: right; }
        .weather-temp { font-size: 1rem; font-weight: 600; margin: 0; color: #0b2545; }
        .weather-location { font-size: 0.7rem; color: #6b7c93; margin: 2px 0 0 0; }

        /* แถบข้อมูลบัญชีผู้ใช้ย่อ */
        .user-bar { 
            background: #0b2545; 
            color: #ffffff;
            padding: 12px 18px; 
            border-radius: 14px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            font-size: 0.85rem; 
            box-shadow: 0 4px 12px rgba(11, 37, 69, 0.15);
        }
        .user-bar span { color: #64ffda; font-weight: 600; }

        /* ตารางแอปพลิเคชัน (Apps Grid) */
        .apps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .app-icon { 
            background: #f8fafc; 
            border-radius: 16px; 
            padding: 14px 8px; 
            text-align: center; 
            cursor: pointer; 
            text-decoration: none; 
            color: #0b2545; 
            font-size: 0.75rem; 
            font-weight: 600;
            transition: 0.2s; 
            border: 1px solid #e2e8f0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        .app-icon:hover { background: #0b2545; color: #ffffff; transform: translateY(-3px); border-color: #0b2545; }
        .app-icon span.icon { font-size: 1.6rem; margin-bottom: 6px; }

        /* ปุ่มแอดมินพิเศษ */
        .admin-btn { 
            background: linear-gradient(135deg, #0b2545, #133863) !important; 
            color: #ffffff !important; 
            grid-column: span 3; 
            border: none !important;
        }
        .admin-btn:hover { opacity: 0.95; }

        /* ปุ่มออกจากระบบ */
        .logout-btn { 
            text-align: center; 
            margin-top: auto; 
            margin-bottom: 10px;
            font-size: 0.85rem; 
            color: #e53e3e; 
            cursor: pointer; 
            padding: 12px; 
            background: #fff5f5; 
            border-radius: 12px; 
            transition: 0.2s; 
            font-weight: 600;
            border: 1px solid #fed7d7;
        }
        .logout-btn:hover { background: #ffe3e3; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Widget: วัน เวลา สภาพอากาศจริง -->
        <div class="widget-box">
            <div>
                <p id="clock" class="clock-time">00:00:00</p>
                <p id="date-str" class="date-text">กำลังโหลดวันที่...</p>
            </div>
            <div class="weather-info">
                <p id="weather" class="weather-temp">🌤️ --°C</p>
                <p class="weather-location">กรุงเทพฯ</p>
            </div>
        </div>

        <!-- แถบแสดงข้อมูลบัญชีเบื้องต้น -->
        <div class="user-bar">
            <div>บัญชี: <span id="acc-num">--------</span></div>
            <div>สิทธิ์: <span id="user-role" style="text-transform: uppercase;">user</span></div>
        </div>

        <!-- Apps Grid (8 แอปหลัก + เมนูแอดมิน) -->
        <div class="apps-grid">
            <a href="bank.html" class="app-icon"><span class="icon">🏦</span>Bank</a>
            <a href="members.html" class="app-icon"><span class="icon">👩‍🎤</span>Members</a>
            <a href="code.html" class="app-icon"><span class="icon">🎟️</span>Code</a>
            <a href="daily.html" class="app-icon"><span class="icon">📅</span>Daily</a>
            <a href="performance.html" class="app-icon"><span class="icon">🎶</span>Performance</a>
            <a href="shop.html" class="app-icon"><span class="icon">🛍️</span>Shop</a>
            <a href="inventory.html" class="app-icon"><span class="icon">🎒</span>Inventory</a>
            <a href="vote.html" class="app-icon"><span class="icon">🗳️</span>Vote</a>
            
            <!-- ปุ่ม Admin (แสดงเฉพาะแอดมิน) -->
            <a href="admin/admin.html" id="admin-app-btn" class="app-icon admin-btn" style="display: none;">
                <span class="icon">⚙️</span>Admin Dashboard (ระบบจัดการวง)
            </a>
        </div>

        <!-- ปุ่มออกจากระบบ -->
        <div class="logout-btn" onclick="logout()">ออกจากระบบ (Logout)</div>
    </div>

    <!-- โหลดไฟล์ตั้งค่ากลาง -->
    <script src="supabase-config.js"></script>
    <script>
        // ตรวจสอบสถานะการเข้าสู่ระบบ
        const user = requireAuth();

        if (user) {
            document.getElementById('acc-num').innerText = user.account_number || 'ADMIN';
            document.getElementById('user-role').innerText = user.role || 'user';

            // ถ้าเป็นแอดมิน หรือใช้อีเมลแอดมินพิเศษ ให้แสดงปุ่มเมนูแอดมิน
            if (user.role === 'admin' || user.email === 'lns48official@gmail.com') {
                document.getElementById('admin-app-btn').style.display = 'flex';
            }
        }

        // ระบบนาฬิกาและวันที่จริงแบบเรียลไทม์ (ภาษาไทย)
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH');
            
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date-str').innerText = now.toLocaleDateString('th-TH', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ดึงข้อมูลสภาพอากาศจริงจาก Open-Meteo API (พิกัดกรุงเทพมหานคร)
        fetch('https://api.open-meteo.com/v1/forecast?latitude=13.7563&longitude=100.5018&current=temperature_2m')
            .then(res => res.json())
            .then(data => {
                const temp = Math.round(data.current.temperature_2m);
                document.getElementById('weather').innerText = `🌡️ ${temp}°C`;
            })
            .catch(() => {
                document.getElementById('weather').innerText = `🌤️ 32°C`;
            });

        // ฟังก์ชันออกจากระบบ
        function logout() {
            localStorage.removeItem('snd48_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
