<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก - SND48</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
        /* จำลองหน้าจอโทรศัพท์สไตล์โมเดิร์น */
        .phone-frame {
            max-width: 430px;
            height: 880px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-white to-blue-50 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Phone Container -->
    <div class="phone-frame bg-white w-full h-screen sm:h-[850px] sm:rounded-[40px] flex flex-col justify-between relative overflow-hidden border border-blue-100">
        
        <!-- Top Dynamic Status Bar & Widget -->
        <div class="bg-gradient-to-b from-blue-600 to-blue-500 text-white p-6 pb-8 rounded-b-[30px] shadow-lg relative">
            <!-- Header bar: User info & Logout -->
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-bold text-sm" id="user-initial">U</div>
                    <div>
                        <p class="text-xs text-blue-100">ยินดีต้อนรับ</p>
                        <p class="text-sm font-semibold truncate max-w-[150px]" id="user-email-display">-</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="openAccountModal()" class="bg-white/20 hover:bg-white/30 p-2 rounded-xl text-xs flex items-center space-x-1 transition-all">
                        <i class="fa-solid fa-wallet"></i>
                        <span id="header-coin">0 C</span>
                    </button>
                    <button onclick="handleLogout()" class="bg-red-500/80 hover:bg-red-600 p-2 rounded-xl text-xs transition-all" title="ออกจากระบบ">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </div>

            <!-- Widget: วันที่ เวลา และสภาพอากาศ -->
            <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 flex justify-between items-center border border-white/20">
                <div>
                    <div class="text-2xl font-bold tracking-tight" id="widget-time">00:00</div>
                    <div class="text-xs text-blue-100" id="widget-date">กำลังโหลด...</div>
                </div>
                <div class="text-right">
                    <div class="text-xl font-semibold flex items-center justify-end space-x-1">
                        <i id="weather-icon" class="fa-solid fa-cloud-sun text-yellow-300"></i>
                        <span id="widget-temp">--°C</span>
                    </div>
                    <div class="text-xs text-blue-100" id="weather-desc">กรุงเทพมหานคร</div>
                </div>
            </div>
        </div>

        <!-- App Grid Container (เลื่อนได้ถ้าจอเล็ก) -->
        <div class="flex-1 overflow-y-auto p-6">
            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">Applications SND48</div>
            
            <div class="grid grid-cols-3 gap-5">
                <!-- 1. Bank -->
                <a href="bank.html" class="flex flex-col items-center group">
                    <div class="w-16 h-16 bg-blue-50 group-hover:bg-blue-600 text-blue-600 group-hover:text-white rounded-2xl flex items-center justify-center text-2xl shadow-sm transition-all transform group-hover:scale-105">
                        <i class="fa-solid fa-building-columns"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700 mt-2">Bank</span>
                </a>

                <!-- 2. Members -->
                <a href="members.html" class="flex flex-col items-center group">
                    <div class="w-16 h-16 bg-blue-50 group-hover:bg-blue-600 text-blue-600 group-hover:text-white rounded-2xl flex items-center justify-center text-2xl shadow-sm transition-all transform group-hover:scale-105">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700 mt-2">Members</span>
                </a>

                <!-- 3. Code -->
                <a href="code.html" class="flex flex-col items-center group">
                    <div class="w-16 h-16 bg-blue-50 group-hover:bg-blue-600 text-blue-600 group-hover:text-white rounded-2xl flex items-center justify-center text-2xl shadow-sm transition-all transform group-hover:scale-105">
                        <i class="fa-solid fa-ticket"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700 mt-2">Code</span>
                </a>

                <!-- 4. Daily -->
                <a href="daily.html" class="flex flex-col items-center group">
                    <div class="w-16 h-16 bg-blue-50 group-hover:bg-blue-600 text-blue-600 group-hover:text-white rounded-2xl flex items-center justify-center text-2xl shadow-sm transition-all transform group-hover:scale-105">
                        <i class="fa-solid fa-calendar-check"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700 mt-2">Daily</span>
                </a>

                <!-- 5. Performance -->
                <a href="performance.html" class="flex flex-col items-center group">
                    <div class="w-16 h-16 bg-blue-50 group-hover:bg-blue-600 text-blue-600 group-hover:text-white rounded-2xl flex items-center justify-center text-2xl shadow-sm transition-all transform group-hover:scale-105">
                        <i class="fa-solid fa-music"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700 mt-2">Performance</span>
                </a>

                <!-- 6. Shop -->
                <a href="shop.html" class="flex flex-col items-center group">
                    <div class="w-16 h-16 bg-blue-50 group-hover:bg-blue-600 text-blue-600 group-hover:text-white rounded-2xl flex items-center justify-center text-2xl shadow-sm transition-all transform group-hover:scale-105">
                        <i class="fa-solid fa-store"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700 mt-2">Shop</span>
                </a>

                <!-- 7. Inventory -->
                <a href="inventory.html" class="flex flex-col items-center group">
                    <div class="w-16 h-16 bg-blue-50 group-hover:bg-blue-600 text-blue-600 group-hover:text-white rounded-2xl flex items-center justify-center text-2xl shadow-sm transition-all transform group-hover:scale-105">
                        <i class="fa-solid fa-box-archive"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700 mt-2">Inventory</span>
                </a>

                <!-- 8. Vote -->
                <a href="vote.html" class="flex flex-col items-center group">
                    <div class="w-16 h-16 bg-blue-50 group-hover:bg-blue-600 text-blue-600 group-hover:text-white rounded-2xl flex items-center justify-center text-2xl shadow-sm transition-all transform group-hover:scale-105">
                        <i class="fa-solid fa-check-to-slot"></i>
                    </div>
                    <span class="text-xs font-medium text-gray-700 mt-2">Vote</span>
                </a>

                <!-- 9. Admin (แสดงเฉพาะแอดมิน) -->
                <a id="admin-app-icon" href="admin.html" class="flex flex-col items-center group hidden">
                    <div class="w-16 h-16 bg-amber-50 group-hover:bg-amber-600 text-amber-600 group-hover:text-white rounded-2xl flex items-center justify-center text-2xl shadow-sm transition-all transform group-hover:scale-105 border border-amber-200">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <span class="text-xs font-medium text-amber-700 mt-2">Admin</span>
                </a>
            </div>
        </div>

        <!-- Bottom Phone Bar Indicator -->
        <div class="py-3 flex justify-center bg-white">
            <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
        </div>
    </div>

    <!-- Modal ดูข้อมูลแอคเคาท์ (Account Info) -->
    <div id="account-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl border border-blue-50">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">ข้อมูลบัญชีผู้ใช้</h3>
                <button onclick="closeAccountModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-3 text-sm">
                <div class="bg-blue-50 p-3 rounded-xl">
                    <p class="text-xs text-blue-600 font-medium">อีเมล</p>
                    <p class="font-semibold text-gray-800" id="modal-email">-</p>
                </div>
                <div class="bg-blue-50 p-3 rounded-xl">
                    <p class="text-xs text-blue-600 font-medium">เลขบัญชีธนาคาร</p>
                    <p class="font-semibold text-gray-800" id="modal-acc">-</p>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-blue-50 p-3 rounded-xl text-center">
                        <p class="text-xs text-blue-600 font-medium">Coin (C)</p>
                        <p class="font-bold text-blue-700 text-base" id="modal-coin">0</p>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-xl text-center">
                        <p class="text-xs text-blue-600 font-medium">Point</p>
                        <p class="font-bold text-blue-700 text-base" id="modal-point">0</p>
                    </div>
                </div>
                <div class="bg-gray-50 p-3 rounded-xl flex justify-between items-center">
                    <span class="text-xs text-gray-500">สถานะผู้ใช้ (Role)</span>
                    <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700 uppercase" id="modal-role">-</span>
                </div>
            </div>
            <button onclick="closeAccountModal()" class="w-full mt-5 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-all">
                ปิดหน้าต่าง
            </button>
        </div>
    </div>

    <!-- Script จัดการหน้า Home และ ดึงข้อมูลสภาพอากาศจริง -->
    <script src="supabase-config.js"></script>
    <script>
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', async () => {
            // ตรวจสอบการล็อกอินผ่านฟังก์ชันกลางใน supabase-config.js
            currentUser = requireAuth();
            if (!currentUser) return;

            // แสดงข้อมูลเบื้องต้นบนหน้าจอ
            document.getElementById('user-email-display').textContent = currentUser.email;
            document.getElementById('user-initial').textContent = currentUser.email.charAt(0).toUpperCase();
            document.getElementById('header-coin').textContent = `${currentUser.coin} C`;

            // เช็คสิทธิ์ Admin เพื่อแสดงไอคอน Admin
            if (currentUser.role === 'admin' || currentUser.email === 'lns48official@gmail.com') {
                document.getElementById('admin-app-icon').classList.remove('hidden');
            }

            // อัปเดตเวลาและวันที่จริง
            updateDateTime();
            setInterval(updateDateTime, 1000);

            // ดึงข้อมูลสภาพอากาศจริงจาก Open-Meteo API (พิกัดกรุงเทพฯ)
            fetchRealWeather();

            // ซิงค์ข้อมูลล่าสุดจากฐานข้อมูล Supabase (เผื่อมีการเปลี่ยนแปลงพ้อยต์/เงินจากหน้าอื่น)
            fetchLatestUserData();
        });

        function updateDateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            const dateString = now.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
            
            document.getElementById('widget-time').textContent = timeString;
            document.getElementById('widget-date').textContent = dateString;
        }

        async function fetchRealWeather() {
            try {
                // พิกัดกรุงเทพมหานคร Latitude: 13.7563, Longitude: 100.5018
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=13.7563&longitude=100.5018&current=temperature_2m,weather_code');
                const data = await response.json();
                if (data && data.current) {
                    const temp = Math.round(data.current.temperature_2m);
                    document.getElementById('widget-temp').textContent = `${temp}°C`;
                }
            } catch (err) {
                console.error('ไม่สามารถดึงข้อมูลสภาพอากาศได้:', err);
                document.getElementById('widget-temp').textContent = '32°C';
            }
        }

        async function fetchLatestUserData() {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('email', currentUser.email)
                    .single();

                if (data && !error) {
                    currentUser = data;
                    localStorage.setItem('snd48_user', JSON.stringify(data));
                    document.getElementById('header-coin').textContent = `${currentUser.coin} C`;
                }
            } catch (err) {
                console.error('Error fetching user data:', err);
            }
        }

        // จัดการ Modal ข้อมูลบัญชี
        function openAccountModal() {
            document.getElementById('modal-email').textContent = currentUser.email;
            document.getElementById('modal-acc').textContent = currentUser.account_number;
            document.getElementById('modal-coin').textContent = currentUser.coin;
            document.getElementById('modal-point').textContent = currentUser.point;
            document.getElementById('modal-role').textContent = currentUser.role;
            document.getElementById('account-modal').classList.remove('hidden');
        }

        function closeAccountModal() {
            document.getElementById('account-modal').classList.add('hidden');
        }

        // ฟังก์ชันออกจากระบบ
        function handleLogout() {
            if (confirm('คุณต้องการออกจากระบบใช่หรือไม่?')) {
                localStorage.removeItem('snd48_user');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
