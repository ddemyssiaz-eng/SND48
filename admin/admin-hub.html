<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - Admin Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background: #f4f6f9; color: #0b2545; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .phone-frame { width: 380px; height: 750px; background: #ffffff; border-radius: 40px; border: 8px solid #0b2545; box-shadow: 0 20px 40px rgba(11, 37, 69, 0.15); display: flex; flex-direction: column; padding: 20px; position: relative; overflow-y: auto; }
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { background: #f0f4f8; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 1rem; color: #0b2545; display: flex; align-items: center; justify-content: center; }
        .header h2 { font-size: 1.1rem; margin: 0 auto; color: #0b2545; }
        .admin-link { background: #f8fafc; border: 1px solid #cbd5e1; padding: 14px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .admin-link:hover { background: #f1f5f9; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="header">
            <button class="back-btn" onclick="location.href='../home.html'">❮</button>
            <h2>Admin Hub</h2>
            <div style="width: 35px;"></div>
        </div>
        <div class="admin-link" onclick="location.href='admin-members.html'">👩‍🎤 จัดการสมาชิกวง (Members) <span>❯</span></div>
        <div class="admin-link" onclick="location.href='admin-code.html'">🎟️ จัดการโค้ดรางวัล (Code) <span>❯</span></div>
        <div class="admin-link" onclick="location.href='admin-p.html'">🎶 จัดการผลงานเพลง (Performance) <span>❯</span></div>
        <div class="admin-link" onclick="location.href='admin-shop.html'">🛒 จัดการร้านค้า (Shop) <span>❯</span></div>
        <div class="admin-link" onclick="location.href='admin-vote.html'">🗳️ จัดการโหวต & คะแนน (Vote) <span>❯</span></div>
    </div>
    <script src="../supabase-config.js"></script>
    <script>
        const currentUser = requireAuth();
        if (currentUser.role !== 'admin') {
            alert('สำหรับแอดมินเท่านั้น');
            location.href = '../home.html';
        }
    </script>
</body>
</html>
