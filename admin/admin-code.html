<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 Admin - จัดการโค้ด</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background: #f4f6f9; color: #0b2545; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .phone-frame { width: 380px; height: 750px; background: #ffffff; border-radius: 40px; border: 8px solid #0b2545; box-shadow: 0 20px 40px rgba(11, 37, 69, 0.15); display: flex; flex-direction: column; padding: 20px; position: relative; overflow-y: auto; }
        .header { display: flex; align-items: center; margin-bottom: 15px; }
        .back-btn { background: #f0f4f8; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 1rem; color: #0b2545; display: flex; align-items: center; justify-content: center; }
        .header h2 { font-size: 1rem; margin: 0 auto; color: #0b2545; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: #0b2545; margin-bottom: 3px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.85rem; outline: none; background: #fafbfc; }
        .action-btn { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #0b2545; color: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-top: 5px; }
        .reward-row { display: flex; gap: 6px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="header">
            <button class="back-btn" onclick="location.href='admin-hub.html'">❮</button>
            <h2>Admin - สร้างโค้ดรางวัล</h2>
            <div style="width: 35px;"></div>
        </div>
        <div class="form-group">
            <label>ตัวโค้ด (Code)</label>
            <input type="text" id="code-text" placeholder="เช่น WELCOME48">
        </div>
        <div class="form-group">
            <label>วันหมดอายุ</label>
            <input type="text" id="code-expire" placeholder="เช่น 31 ธันวาคม 2569">
        </div>
        <div class="form-group">
            <label>รายการรางวัล (Rewards)</label>
            <div id="rewards-container">
                <div class="reward-row">
                    <select class="rew-type" style="flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1;">
                        <option value="coin">Coin (เงิน)</option>
                        <option value="point">Point (พ้อยต์)</option>
                    </select>
                    <input type="number" class="rew-amount" placeholder="จำนวน" style="flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1;">
                </div>
            </div>
            <button style="background: #e2e8f0; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; margin-top: 5px;" onclick="addRewardRow()">+ เพิ่มรางวัลอีกอย่าง</button>
        </div>
        <button class="action-btn" onclick="saveCode()">บันทึกโค้ดเข้าระบบ</button>
    </div>
    <script src="../supabase-config.js"></script>
    <script>
        const currentUser = requireAuth();
        if (currentUser.role !== 'admin') { location.href = '../home.html'; }

        function addRewardRow() {
            const container = document.getElementById('rewards-container');
            container.innerHTML += `
                <div class="reward-row">
                    <select class="rew-type" style="flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1;">
                        <option value="coin">Coin (เงิน)</option>
                        <option value="point">Point (พ้อยต์)</option>
                    </select>
                    <input type="number" class="rew-amount" placeholder="จำนวน" style="flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1;">
                </div>
            `;
        }

        async function saveCode() {
            const code = document.getElementById('code-text').value.trim().toUpperCase();
            const expires_at = document.getElementById('code-expire').value.trim();
            
            const types = document.querySelectorAll('.rew-type');
            const amounts = document.querySelectorAll('.rew-amount');
            let rewards = [];

            for (let i = 0; i < types.length; i++) {
                const amt = parseInt(amounts[i].value);
                if (amt > 0) {
                    rewards.push({ type: types[i].value, amount: amt });
                }
            }

            if (!code || rewards.length === 0) {
                alert('กรุณากรอกโค้ดและระบุรางวัลให้ถูกต้อง');
                return;
            }

            const { error } = await supabase.from('codes').insert([{ code, rewards, expires_at }]);
            if (error) {
                alert('เกิดข้อผิดพลาด (โค้ดอาจซ้ำ): ' + error.message);
            } else {
                alert('สร้างโค้ดสำเร็จ!');
                location.href = 'admin-hub.html';
            }
        }
    </script>
</body>
</html>
