<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SND48 - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .phone-frame { max-width: 430px; height: 880px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Phone Container -->
    <div class="phone-frame bg-gray-50 w-full h-screen sm:h-[850px] sm:rounded-[40px] flex flex-col justify-between relative overflow-hidden border border-purple-100 shadow-2xl">
        
        <!-- Header -->
        <div class="bg-white px-6 py-4 flex items-center justify-between border-b border-gray-100 pt-8">
            <div class="flex items-center space-x-3">
                <a href="home.html" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-purple-50 hover:text-purple-600 transition-all">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </a>
                <h1 class="text-base font-bold text-gray-800">Admin Dashboard</h1>
            </div>
            <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2.5 py-1 rounded-full">
                <i class="fa-solid fa-shield-halved mr-1"></i> ผู้ดูแลระบบ
            </span>
        </div>

        <!-- Content Area: เมนูทางลัดไปยังระบบต่างๆ ของแอดมิน -->
        <div class="flex-1 overflow-y-auto p-5 space-y-4">
            
            <!-- Welcome Banner -->
            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 p-5 rounded-3xl text-white shadow-lg shadow-purple-200">
                <h2 class="text-base font-bold">ยินดีต้อนรับ, แอดมิน</h2>
                <p class="text-[11px] text-white/80 mt-1">จัดการระบบร้านค้า กิจกรรมโหวต และข้อมูลสมาชิกทั้งหมดได้จากที่นี่</p>
            </div>

            <!-- Menu Grid -->
            <div class="grid grid-cols-2 gap-3">
                
                <!-- จัดการร้านค้า -->
                <a href="admin-shop.html" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md hover:border-purple-200 transition-all flex flex-col justify-between group">
                    <div class="w-10 h-10 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center text-sm group-hover:scale-110 transition-transform mb-3">
                        <i class="fa-solid fa-store"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-xs">จัดการร้านค้า</h3>
                        <p class="text-[10px] text-gray-400 mt-0.5">เพิ่ม/ลบ สินค้าใน Shop</p>
                    </div>
                </a>

                <!-- จัดการระบบโหวต -->
                <a href="admin-vote.html" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md hover:border-purple-200 transition-all flex flex-col justify-between group">
                    <div class="w-10 h-10 rounded-2xl bg-pink-50 text-pink-600 flex items-center justify-center text-sm group-hover:scale-110 transition-transform mb-3">
                        <i class="fa-solid fa-check-to-slot"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-xs">จัดการระบบโหวต</h3>
                        <p class="text-[10px] text-gray-400 mt-0.5">สร้างแคมเปญ & ดูคะแนนลับ</p>
                    </div>
                </a>

                <!-- จัดการสมาชิก / เติมเงิน (ถ้ามีแยก หรือใช้ระบบธนาคาร) -->
                <a href="admin-users.html" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md hover:border-purple-200 transition-all flex flex-col justify-between group">
                    <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-sm group-hover:scale-110 transition-transform mb-3">
                        <i class="fa-solid fa-users-gear"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-xs">จัดการสมาชิก</h3>
                        <p class="text-[10px] text-gray-400 mt-0.5">ตรวจยอด Coin / Point</p>
                    </div>
                </a>

                <!-- กลับหน้าหลักผู้ใช้ -->
                <a href="home.html" class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md hover:border-gray-200 transition-all flex flex-col justify-between group">
                    <div class="w-10 h-10 rounded-2xl bg-gray-100 text-gray-600 flex items-center justify-center text-sm group-hover:scale-110 transition-transform mb-3">
                        <i class="fa-solid fa-house"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-xs">กลับหน้าหลัก</h3>
                        <p class="text-[10px] text-gray-400 mt-0.5">มุมมองผู้ใช้งานทั่วไป</p>
                    </div>
                </a>

            </div>

        </div>

        <!-- Footer Bar -->
        <div class="py-3 flex justify-center bg-white border-t border-gray-100">
            <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        const currentUser = requireAuth();
        // ตรวจสอบความปลอดภัยเบื้องต้นว่าต้องเป็น admin เท่านั้น
        if (currentUser.role !== 'admin') {
            alert('พื้นที่นี้สำหรับผู้ดูแลระบบเท่านั้น!');
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
